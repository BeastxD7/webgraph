name: 📊 Benchmark result
description: You ran one of the benchmark runners and got a number worth recording — better, worse, or different from the published one.
title: "[benchmark] <benchmark>: <number> on <commit>"
labels: ["benchmark"]
body:
  - type: dropdown
    id: benchmark
    attributes:
      label: Benchmark
      options:
        - WCXB (benchmark/wcxb)
        - Zyte article-extraction (benchmark/article_extraction)
        - WCEB (benchmark/wceb)
        - WebMainBench (benchmark/webmainbench)
        - CleanEval (benchmark/cleaneval)
        - Reading order (benchmark/reading_order)
        - Firecrawl scrape-evals (benchmark/scrape_evals)
        - Other / new (describe below)
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit measured
      placeholder: 45a1b36
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command
      description: Including corpus path, split, flags and environment variables such as WCXB_ROUTER_OOF.
      render: shell
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: The runner's output
      description: Paste the summary table as printed. Do not retype numbers.
      render: text
    validations:
      required: true
  - type: textarea
    id: compare
    attributes:
      label: Compared with
      description: The number on the Benchmarks page or in docs/, and the commit it was measured on.
  - type: textarea
    id: notes
    attributes:
      label: What might explain a difference
      description: Corpus version, split, machine, runner flags, a change under test, anything else.
  - type: textarea
    id: worst
    attributes:
      label: Worst pages (if the runner printed them)
      description: The `--worst` listing, or the page ids that moved most. This is where the next fix comes from.
      render: text
