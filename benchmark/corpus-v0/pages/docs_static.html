<!doctype html><html><head><meta charset="utf-8"><title>Configuring retries</title></head>
<body><article><h1>Configuring retries</h1>
<p>Retries are controlled by the <code>max_retries</code> setting, which defaults to three.</p>
<p>Set it to zero to disable retrying entirely.</p></article></body></html>
