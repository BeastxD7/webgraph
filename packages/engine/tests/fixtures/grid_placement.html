<!doctype html><html><head><meta charset="utf-8"><title>Grid explicit placement</title>
<style>body{margin:0;font:16px/1.4 sans-serif}
.g{display:grid;grid-template-columns:400px 400px;gap:40px;width:840px}
.g p{margin:0 0 16px}</style></head>
<body><div class="g">
  <p style="grid-column:2;grid-row:1">B1 right top</p>
  <p style="grid-column:1;grid-row:1">A1 left top</p>
  <p style="grid-column:2;grid-row:2">B2 right bottom</p>
  <p style="grid-column:1;grid-row:2">A2 left bottom</p>
</div></body></html>
