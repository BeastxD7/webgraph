<!doctype html><html><head><meta charset="utf-8"><title>Flex order reversal</title>
<style>body{margin:0;font:16px/1.4 sans-serif}.col{display:flex;flex-direction:column;width:600px}
.col p{margin:0 0 20px}</style></head>
<body><div class="col">
  <p style="order:3">GAMMA third paragraph</p>
  <p style="order:1">ALPHA first paragraph</p>
  <p style="order:2">BETA second paragraph</p>
</div></body></html>
