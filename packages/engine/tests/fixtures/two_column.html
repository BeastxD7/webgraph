<!doctype html><html><head><meta charset="utf-8"><title>Row reverse columns</title>
<style>body{margin:0;font:16px/1.4 sans-serif;width:900px}
header,footer{padding:10px;background:#eee}
.wrap{display:flex;flex-direction:row-reverse;gap:60px}
.side{width:380px}.side p{margin:0 0 18px}</style></head>
<body>
  <header><h1>HEADER spanning both columns</h1></header>
  <div class="wrap">
    <div class="side"><p>RIGHT one</p><p>RIGHT two</p><p>RIGHT three</p></div>
    <div class="side"><p>LEFT one</p><p>LEFT two</p><p>LEFT three</p></div>
  </div>
  <footer><p>FOOTER spanning both columns</p></footer>
</body></html>
