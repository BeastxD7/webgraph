    <h1>Installation guide</h1>
    <p>Seat the flange against the mounting plate and torque the bolts to twelve newton
       metres in a diagonal sequence. Do not exceed fourteen newton metres.</p>
    <pre><code>torque --units nm --target 12 --pattern diagonal</code></pre>
