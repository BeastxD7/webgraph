[project]
name = "webgraph"
version = "0.1.0"
description = "Universal web content extraction engine with provenance and reading-order preservation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.28",
    "lxml>=5.3",
    "pydantic>=2.10",
    "jsonschema>=4.23",
]

[project.scripts]
webgraph = "webgraph.cli:main"

[project.optional-dependencies]
render = ["playwright>=1.49"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "lxml-stubs>=0.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webgraph"]
artifacts = ["src/webgraph/py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ARG", "PTH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: test requires live network access (deselect with -m 'not network')",
    "render: test requires a Playwright browser (deselect with -m 'not render')",
]
