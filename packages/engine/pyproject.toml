[project]
name = "webgraph"
version = "0.1.0"
description = "Universal web content extraction engine with provenance and reading-order preservation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    # `http2` pulls in h2. Not decoration: measured on 1,000 live URLs, a client that speaks
    # only HTTP/1.1 and refuses brotli is answered differently by several CDNs than one that
    # negotiates what a browser negotiates. See `webgraph.fetch.static`.
    "httpx[http2]>=0.28.1",
    "brotli>=1.1",
    "lxml>=6.1.3",
    "pydantic>=2.10",
    "jsonschema>=4.23",
]

[project.scripts]
webgraph = "webgraph.cli:main"

[project.optional-dependencies]
render = ["playwright>=1.49"]
# Pushing a knowledge graph into Neo4j (`webgraph kg sync-neo4j`, POST /api/graph/sync/neo4j).
# Optional on purpose: the graph lives in SQLite and the database is a push target.
kg-neo4j = ["neo4j>=5.20"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "lxml-stubs>=0.5.1",
]
bench = [
    # Reference extractors for the content-quality benchmark. Not runtime dependencies and
    # never vendored -- the engine is scored *against* these, so they must stay outside it.
    "trafilatura>=2.0",
    "readability-lxml>=0.8.1",
    "justext>=3.0",
    # WebMainBench (benchmark/webmainbench) imports the corpus's own MetricCalculator rather
    # than reimplementing edit distance or TEDS, so it inherits that code's dependencies.
    # All permissive: apted MIT, rapidfuzz MIT, beautifulsoup4 MIT, jieba MIT. Deliberately
    # NOT IBM's PubTabNet `TEDS.py` (licence NOASSERTION) and NOT `table-recognition-metric`
    # (pulls GPL-2.0 `Levenshtein`). resiliparse is a calibration baseline, not a dependency
    # of the engine -- it is scored alongside webgraph to prove the harness reproduces the
    # published leaderboard rows.
    "apted>=1.0.3",
    "rapidfuzz>=3.9",
    "beautifulsoup4>=4.12",
    "jieba>=0.42",
    "resiliparse>=0.14.5",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webgraph"]
artifacts = ["src/webgraph/py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ARG", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# RUF001 flags "ambiguous" Unicode -- a multiplication sign that could be the letter x, a
# minus sign that could be a hyphen. In a MathML-to-LaTeX table those characters are the
# subject, not a typo: the whole file exists to map them to their LaTeX spellings.
"src/webgraph/dom/math.py" = ["RUF001"]
"tests/test_math.py" = ["RUF001"]
# Same reason: a subscript/superscript minus key alongside the ASCII hyphen a `-` key -- a
# page's own `<sup>` can use either character, and both must map to the same glyph.
"src/webgraph/dom/rich.py" = ["RUF001"]
"tests/test_markdown_structure.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
files = ["src"]

[[tool.mypy.overrides]]
# jsonschema ships no inline types and `types-jsonschema` is not a dev dependency; the
# `neo4j` driver is an optional extra that is usually not installed.
module = ["jsonschema", "jsonschema.*", "neo4j", "neo4j.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: test requires live network access (deselect with -m 'not network')",
    "render: test requires a Playwright browser (deselect with -m 'not render')",
]
