[project]
name = "webgraph-api"
version = "0.1.0"
description = "HTTP API over the webgraph extraction engine."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "webgraph[render]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.9", "mypy>=1.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webgraph_api"]

[tool.uv.sources]
webgraph = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PTH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
