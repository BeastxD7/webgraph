packages:
  - "apps/web"

# unrs-resolver is the native module resolver behind eslint-import-resolver-typescript,
# which eslint-config-next pulls in. pnpm refuses to install until every dependency with a
# build script is explicitly allowed or denied; left undecided it fails with
# ERR_PNPM_IGNORED_BUILDS, which is what broke CI on every commit of this repository.
#
# Approved by name rather than by a blanket setting, so a *new* dependency that wants to run
# a script still stops the install and gets looked at.
allowBuilds:
  # esbuild's postinstall only verifies the native binary that its platform package
  # (@esbuild/<os>-<arch>) already ships; fumadocs-mdx pulls it in. Denied: the binary
  # works without the script, and nothing else needs to run at install time.
  esbuild: false
  unrs-resolver: true
