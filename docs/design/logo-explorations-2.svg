<text x="30" y="16" font-family="Manrope, -apple-system, sans-serif" font-size="11" fill="#66738a">webgraph mark, round 2 — the site becomes a graph, and the graph travels. 24-unit grid, 2.2-unit edges, 2.3-unit nodes, currentColor; each at 96 / 32 / 16 px, then 16 px in the accent.</text>
<text x="30" y="364" font-family="Manrope, -apple-system, sans-serif" font-size="11" fill="#46526a">Cliché test — share icon: 5 fails (three nodes off a hub), 7 borderline (a triangle of nodes); Wi-Fi: none (no nested arcs); hex mesh / atom: none; Neo4j (three joined discs): 5, 7 near; GraphQL (hexagon): none; globe glyph: 3 near. Chart/heartbeat: 1 near (a zigzag alone); with the limb (8) it reads as a constellation over the Earth.</text>
